<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=optional" rel="stylesheet">
<!-- ===== MACHINERY: styles. Do not edit. The title is set from PAGE.title. ===== -->
<style>
:root{
  /* Neutral grays, no tint */
  --paper:#EFEFEF; --sheet:#F7F7F7; --white:#FFFFFF; --ink:#272727; --muted:#5F5F5F; --rule:#D2D2D2; --grid:#E4E4E4; --tint:#E8E8E8;
  /* Saturated colour, only where it means something */
  --a:#1F5FA8; --a-bg:#E3ECF7; --b:#A12E78; --int:#848484;
  --ok:#2E7A45; --no:#A3342B; --open:#9A5B00; --openbg:#FBF1E1;
  --cond:"Barlow Semi Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cvh:460px;
}
@media (max-width:1360px){:root{--cvh:420px}}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5}
body{overflow-y:scroll}
html:not(.ready) body{visibility:hidden}
button{font:inherit;color:inherit}
a{color:var(--a)}
code{font-family:var(--mono);font-size:.86em;background:var(--tint);border-radius:3px;padding:1px 4px;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}

/* Header and tabs */
.wrap{max-width:1480px;margin:0 auto;padding:0 24px 40px}
.top{padding:16px 0 10px}
.top h1{font:700 26px/1.1 var(--cond);margin:0;letter-spacing:-.2px}
.top .src{margin:4px 0 0;color:var(--muted);font-size:13px}
.tabbar{position:sticky;top:0;z-index:30;background:var(--paper);display:flex;border-bottom:1.5px solid var(--ink);margin:0 0 18px;padding-top:6px}
.tabbar button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:8px 18px;font:600 17px var(--cond);cursor:pointer;color:var(--muted)}
.tabbar button:hover{color:var(--ink)}
.tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabbar .cnt{font:500 13px var(--body);color:var(--muted);margin-left:6px}
.view{display:none}
.view.on{display:block}

/* Story: chapter rail */
.view.story.on{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1360px){.view.story.on{grid-template-columns:200px minmax(0,1fr);gap:22px}}
.rail{position:sticky;top:58px}
.prog{font:600 14px var(--cond);color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.rail ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.rail li button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:7px 4px 7px 0;cursor:pointer;font-size:14px;line-height:1.3}
.rail li button .n{font:700 13px var(--cond);width:22px;height:22px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;color:var(--muted);margin-top:-1px}
.rail li button.seen .n{border-color:var(--ink);color:var(--ink)}
.rail li button[aria-current="step"]{font-weight:600}
.rail li button[aria-current="step"] .n{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.rail li button:hover{background:var(--sheet)}
.rail .keys{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* Chapter text */
main{min-width:0}
.chap{display:none}
.chap.on{display:block}
.q{font:600 17px var(--cond);color:var(--muted);margin:2px 0}
.chap h2{font:700 34px/1.08 var(--cond);letter-spacing:-.4px;margin:0 0 10px}
.lead{font-size:17px;line-height:1.45;margin:0 0 16px;max-width:92ch}
.chap h3{font:700 20px/1.2 var(--cond);margin:22px 0 8px}
.chap h4{font:700 16.5px var(--cond);margin:14px 0 4px}
.chap p{margin:0 0 10px;max-width:92ch}
.chap ul{margin:0 0 10px;padding-left:20px;max-width:92ch}
.chap li{margin:3px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.lbl{font:600 12.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.next{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0 10px;padding-top:16px;border-top:1.5px solid var(--ink)}
.next button{text-align:left;background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px;cursor:pointer;min-height:68px}
.next button:hover{background:var(--white)}
.next button small{display:block;font:600 13px var(--cond);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.next button span{font:700 18px var(--cond)}
.next button.r{text-align:right}
.next button[disabled]{visibility:hidden}

/* Inline links: example chips, decision names, chapter links, dotted terms, prototype links */
a.ex,a.dc,a.ch{font:500 12.5px var(--mono);color:var(--ink);text-decoration:none;border:1px solid var(--muted);border-radius:3px;padding:0 4px;background:var(--sheet);cursor:pointer;white-space:nowrap}
a.dc,a.ch{font:600 13.5px var(--cond);padding:0 5px}
a.ex:hover,a.dc:hover,a.ch:hover{background:var(--white);border-color:var(--ink)}
a.t{color:inherit;text-decoration:none;border-bottom:1.5px dotted var(--muted);cursor:pointer}
a.t:hover,a.t.hit{background:var(--a-bg);border-bottom-color:var(--a)}
a.proto{font-weight:600;white-space:nowrap}
a.proto::after{content:" \2197";font-weight:400}
.ids{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end}

/* Figures: tiles, cards, claims, flow, timeline */
.tiles,.cards,.flow,.tl,.opts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tiles{gap:10px;margin:4px 0 10px}
.tile,.card{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:9px 12px;min-width:0}
.tile b{display:block;font:700 24px/1.1 var(--cond)}
.tile span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.cards,.opts{gap:14px;margin:4px 0 10px}
.card{padding:12px 14px}
.chap .card h4{margin:0 0 4px}
.card p{margin:0 0 6px;font-size:14.5px}
.claims{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:4px 0 8px}
.claims>div{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14.5px;min-width:0}
.claims .ids{max-width:170px}
.flow{margin:4px 0 12px}
.flow>div{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:9px 12px;font-size:14px;position:relative;margin-right:22px;min-width:0}
.flow>div:last-child{margin-right:0}
.flow>div::after{content:"";position:absolute;right:-20px;top:50%;border:8px solid transparent;border-left:12px solid var(--ink);margin-top:-8px}
.flow>div:last-child::after{display:none}
.flow b{display:block;font:700 15.5px var(--cond);margin-bottom:2px}
.flow .n{font:700 13px var(--cond);color:var(--sheet);background:var(--ink);border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;margin-right:6px}
.tl{border-top:3px solid var(--ink);margin:16px 0 10px}
.tl>div{padding:10px 12px 0 0;position:relative;font-size:13.5px;min-width:0}
.tl>div::before{content:"";position:absolute;top:-9px;left:0;width:13px;height:13px;border-radius:50%;background:var(--ink)}
.tl>div.op::before{background:var(--openbg);border:2.5px dashed var(--open)}
.tl b{display:block;font:700 16px var(--cond)}
.opts ul{padding-left:0;list-style:none;font-size:14px}
.opts li{padding-left:18px;position:relative}
.opts li.pro::before,.opts li.con::before{position:absolute;left:0;font-weight:700}
.opts li.pro::before{content:"+";color:var(--ok)}
.opts li.con::before{content:"\2212";color:var(--no)}

/* Before and after; production beside tests */
.ba,.pt{display:grid;grid-template-columns:170px 1fr 1fr;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--sheet);font-size:13.5px;margin:4px 0 8px}
.ba>div,.pt>div{line-height:20px;padding:7px 10px;border-top:1px solid var(--rule);border-left:1px solid var(--rule);min-width:0;overflow-wrap:anywhere}
.ba .h,.pt .h{font:600 14px var(--cond);background:var(--tint);border-top:0}
.ba .rh,.pt .rh{font:600 14px var(--cond);border-left:0}
.ba .aft{background:var(--white)}
.pt .fk{font:12.5px var(--mono);background:var(--tint)}
.pt .wide{grid-column:2 / -1}

/* Fork: allowed and denied; refused and accepted */
.fork{margin:6px 0 10px;padding-left:28px;position:relative;font-size:14px}
.fork .fq{display:inline-block;margin-left:-28px;font:600 15px var(--cond);background:var(--tint);border:1.5px solid var(--ink);border-radius:4px;padding:5px 12px}
.fork .hd,.fork .r{display:grid;grid-template-columns:120px 1fr 1fr}
.fork .hd{font:600 12.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.fork .hd>div{padding:0 10px}
.fork .r{position:relative;background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;margin:6px 0;align-items:center}
.fork .r::before,.fork .r:not(:last-child)::after{content:"";position:absolute;left:-21px;top:-8px;border-left:2.5px solid var(--ink)}
.fork .r::before{width:19px;height:calc(50% + 8px);border-bottom:2.5px solid var(--ink)}
.fork .r:not(:last-child)::after{bottom:-1px}
.fork .fq+.r::before,.fork .fq+.r::after{top:-12px}
.fork .hd+.r::before,.fork .hd+.r::after{top:-36px}
.fork .fq+.r::before{height:calc(50% + 12px)}
.fork .hd+.r::before{height:calc(50% + 36px)}
.fork .r>div{padding:7px 10px;border-left:1px solid var(--rule);min-width:0;align-self:stretch}
.fork .r>div:first-child{border-left:0;display:flex;align-items:center}
.yn{font:700 11.5px var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:3px;white-space:nowrap;text-align:center;min-width:72px;display:inline-block}
.yn.ok{background:var(--ok);color:var(--white);border:1.5px solid var(--ok)}
.yn.no{border:1.5px dashed var(--no);color:var(--no)}
.ra{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:6px 0 8px;font-size:13.5px}
.ra .x{background:var(--white);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;min-width:0;line-height:1.35}

/* Open items, code, the one disclosure */
.open{border:2px dashed var(--open);background:var(--openbg);border-radius:4px;padding:10px 16px;margin:8px 0 14px}
.chap .open>h4{color:var(--open);margin:0 0 4px;font:700 18px var(--cond)}
.open p,.open li{max-width:none}
.open.line{display:flex;gap:14px;align-items:baseline;padding:8px 16px}
.chap .open.line>h4{margin:0;white-space:nowrap}
.open.line p{margin:0}
pre.code{font:13px/1.5 var(--mono);background:var(--ink);color:#EAEAEA;border-radius:4px;padding:12px 14px;margin:4px 0 14px;overflow-x:auto;white-space:pre}
pre.code .cm{color:#A4A4A4}
pre.code a.ex{background:#383838;color:#EAEAEA;border-color:var(--muted);font-size:11.5px}
details.more{border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet);margin:12px 0 14px}
details.more summary{font:600 15px var(--cond);padding:8px 12px;cursor:pointer}
details.more>div{padding:0 12px 6px}
details.more pre.code{margin-top:8px}
table.t{width:100%;border-collapse:collapse;background:var(--sheet);border:1.5px solid var(--ink);font-size:14.5px;margin:4px 0 14px}
table.t th,table.t td{text-align:left;padding:7px 10px;border-top:1px solid var(--rule);vertical-align:top}
table.t thead th{font:600 15px var(--cond);border-top:0;background:var(--tint)}
table.ss{font-size:13.5px}
table.ss th,table.ss td{padding:6px 8px}
table.ss tbody th{font:600 14px var(--cond);background:var(--tint)}

/* Pannable canvas: fixed height, drag to move, zoom with buttons or ctrl + wheel */
.canvas{position:relative;height:var(--cvh);background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;touch-action:none;cursor:grab;user-select:none}
.canvas.drag{cursor:grabbing}
.canvas svg.dia{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
.canvas.anim svg.dia{transition:transform .35s ease}
.cv-ctl{position:absolute;right:10px;bottom:8px;display:flex;gap:6px;z-index:2}
.cv-ctl button{font:600 14px var(--cond);background:var(--white);border:1.5px solid var(--ink);border-radius:3px;min-width:32px;height:30px;padding:0 10px;cursor:pointer}
.cv-ctl button:hover{background:var(--tint)}
.cv-hint{position:absolute;left:10px;bottom:8px;font:500 12.5px var(--body);color:var(--muted);background:rgba(247,247,247,.85);border-radius:3px;padding:2px 8px;pointer-events:none}

/* Diagram */
.zone rect{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:6 5;opacity:.5}
.zone text{font:600 15px var(--cond);fill:var(--muted)}
.node{cursor:pointer}
.node rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.node.new rect{stroke-width:3}
.node.ext rect{stroke:var(--muted);stroke-dasharray:4 3}
.node .nm{font:600 16px var(--cond);fill:var(--ink)}
.node .sb{font:500 12.5px var(--body);fill:var(--muted)}
.node:hover rect,.node.sel rect{fill:var(--white)}
.node.sel rect{stroke:var(--a)}
.edge .halo{fill:none;stroke:var(--sheet);stroke-width:7}
.edge .ln{fill:none;stroke-width:2.2;stroke:var(--ink)}
.edge.a .ln{stroke:var(--a)}
.edge.b .ln{stroke:var(--b);stroke-dasharray:9 4}
.edge.int .ln{stroke:var(--int);stroke-dasharray:2 4;stroke-width:2}
.edge .lb{font:500 12px var(--body);fill:var(--muted);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.dim .edge:not(.on) .ln{opacity:.22}
.dim .edge:not(.on) .lb{opacity:.35}
.dim .node:not(.on){opacity:.45}
.edge.on .ln{stroke-width:3.4;stroke-dasharray:12 5;animation:flow 1.1s linear infinite}
.edge.on .lb{fill:var(--ink);font-weight:600}
@keyframes flow{to{stroke-dashoffset:-34}}
@media (prefers-reduced-motion:reduce){.edge.on .ln{animation:none}.canvas.anim svg.dia{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Walk: the caption band above the picture it explains */
.walk{margin:10px 0 14px}
.band{background:var(--white);border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px;margin-bottom:10px}
.band .row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.band .pill{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--ink);background:var(--sheet);font:700 14px var(--cond);cursor:pointer;padding:0}
.band .pill[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.band .cnt{font-size:13px;color:var(--muted);margin-left:6px}
.band .sp{flex:1}
.band .nb{font:600 14px var(--cond);border:1.5px solid var(--ink);background:var(--sheet);border-radius:3px;padding:4px 14px;cursor:pointer}
.band .nb:disabled{opacity:.35;cursor:default}
.chap .band h4{margin:2px 0 3px;font:700 19px var(--cond)}
.chap .band p{font-size:14.5px;margin:0;max-width:none}
.band .tst{display:block;margin-top:5px;font-size:13.5px;color:var(--muted)}
.band .tst b{font:600 11.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;margin-right:7px}

/* Reference tabs, full width */
.vhead{display:flex;align-items:center;gap:16px;margin:0 0 14px;flex-wrap:wrap}
.vhead h2{font:700 30px/1.1 var(--cond);margin:0}
.vhead input{font:15px var(--body);border:1.5px solid var(--ink);border-radius:3px;padding:7px 10px;background:var(--white);width:360px}
.vhead .cnt{color:var(--muted);font-size:14px}
.vhead .note{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
.rgrp{font:600 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;padding-top:6px;border-top:1.5px solid var(--ink)}
.rgrp:first-child{margin-top:0}
.ssh{font:700 20px var(--cond);margin:18px 0 6px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}
.cols2{columns:2;column-gap:16px}
.rc{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:10px 14px;min-width:0;scroll-margin-top:70px}
.rc.hit{outline:3px solid var(--a)}
.cols2 .rc{break-inside:avoid;margin-bottom:16px}
.rc.pending,.pop .pending{border:2px dashed var(--open);background:var(--openbg)}
.rc p,.rc ul{font-size:14px;margin:0 0 6px}
.rc ul,.pop ul{padding-left:18px}
.rc .lbl{margin-top:6px}
.empty{padding:14px 0;color:var(--muted);font-size:14px}
.hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 2px}
.hd .id{font:600 14px var(--mono)}
.hd .mk{font:12.5px var(--mono);color:var(--muted)}
.hd .st{font:700 12.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--open)}
.rc h4,.pop h4{margin:0 0 4px;font:700 17px var(--cond)}
.rc h3,.pop h3{font:700 21px/1.15 var(--cond);margin:0 0 4px}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 8px}

/* Popover: a fixed panel, so opening it never moves the page */
.pop{position:fixed;right:24px;top:64px;width:440px;max-height:calc(100vh - 84px);z-index:50;background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;box-shadow:0 10px 40px rgba(39,39,39,.3);display:flex;flex-direction:column}
.pop[hidden]{display:none}
.pop .ph{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1.5px solid var(--ink);flex:none}
.pop .kind{font:600 12.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1}
.pop .ph button{font:600 13.5px var(--cond);background:var(--white);border:1.5px solid var(--ink);border-radius:3px;padding:3px 10px;cursor:pointer}
.pop .ph button.x{min-width:30px;padding:3px 8px;font-size:16px;line-height:1}
.pop .pb{overflow-y:auto;padding:12px 14px 16px;overscroll-behavior:contain}
.pop .pb>.pending{padding:8px 12px;border-radius:4px;margin-bottom:8px}
.pop p{font-size:14.5px;margin:0 0 9px}
.pop ul{font-size:14px;margin:0 0 9px}
.pop .lbl{margin:12px 0 3px}
</style>
</head>
<body>

<!-- ===================================================================
     CONTENT: the only part to edit. Chapters go in the template below,
     one <section data-chapter="id" data-title="Rail title"> each, in
     reading order. Data goes in PAGE. See references/template.md.
     =================================================================== -->
<template id="chapters">

<section data-chapter="short" data-title="In short">
  <p class="q">What is being built, for whom, and how will we know it works?</p>
  <h2>Overdue invoices get timely, polite reminders</h2>
  <p class="lead">Today the finance team chases overdue invoices by hand, so some customers hear nothing for weeks and others get three emails in a day. The app will send each customer a <a class="t" data-t="reminder">reminder</a> on a fixed <a class="t" data-t="schedule">schedule</a> once an invoice is <a class="t" data-t="overdue">overdue</a>, and stop as soon as it is paid or disputed.</p>

  <div class="tiles">
    <div class="tile"><b>41 days</b><span>from due date to payment, on average, last quarter.</span></div>
    <div class="tile"><b>23%</b><span>of overdue invoices got no reminder at all.</span></div>
    <div class="tile"><b>3 emails</b><span>in one day, the most one customer received.</span></div>
  </div>

  <h3>Who it is for</h3>
  <div class="cards">
    <div class="card"><h4>The finance team</h4><p>Stops chasing by hand. Sees every reminder sent or held in the activity log.</p></div>
    <div class="card"><h4>The customer</h4><p>Gets at most three reminders per invoice, never two in a week, and can <a class="t" data-t="pause">pause</a> them.</p></div>

<section data-chapter="rules" data-title="When a reminder goes out">
  <p class="q">When does a customer get a reminder, and when not?</p>
  <h2>Three reminders, never two in a week</h2>
  <p class="lead">Each overdue invoice gets up to three reminders, on days 3, 10 and 30 after its due date. A reminder that falls inside the <a class="t" data-t="quiet-period">quiet period</a> waits until it ends. <a class="dc" data-d="schedule"></a> <a class="dc" data-d="quiet"></a></p>

<section data-chapter="design" data-title="The program design">
  <p class="q">Where does the code live, and what mistakes can't it make?</p>
  <h2>The program design</h2>
  <div class="open line">
    <h4>Draft, not reviewed</h4>
    <p>Every module and type name is a proposal to accept, change or reject.</p>
  </div>
  <p class="lead">The policy is one pure function: it gets an invoice, its history and today's date, and answers send, hold or stop. Everything that talks to the outside world sits around it.</p>

  <h3>Two mistakes the types refuse before anything runs</h3>
  <div class="cards">
    <div class="card"><h4>A reminder can't skip the policy</h4>
      <div class="ra">
        <span class="yn no">Refused</span><span class="x">The scheduler calls the mailer with an invoice directly. It doesn't compile.</span>
        <span class="yn ok">Accepted</span><span class="x">The mailer takes only a <code>SendDecision</code>, which only the policy can make.</span>
      </div>
      <p>So no code path sends without the quiet period check. <a class="ex" data-e="E2"></a></p></div>
    <div class="card"><h4>A hold can't lose its reason</h4>
      <div class="ra">
        <span class="yn no">Refused</span><span class="x">The policy returns <code>false</code>. The log would have to guess why.</span>
        <span class="yn ok">Accepted</span><span class="x">The policy returns <code>hold</code> with the date the quiet period ends.</span>
      </div>
      <p>The log and the scheduler read the same answer, so they can't disagree. <a class="ex" data-e="E5"></a></p></div>
  </div>

<pre class="code">type Decision =
  | { kind: 'send'; reminder: 1 | 2 | 3 }      <span class="cm">// E1, E3</span>

  </div></details>
</section>
