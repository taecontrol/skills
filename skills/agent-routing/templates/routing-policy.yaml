version: 1

scope:
  operation: orchestrator_subagent_dispatch
  resolve_against: current_harness

defaults:
  deny_unlisted_profiles: true
  no_silent_provider_substitution: true

providers:
  denied: [openrouter]

models:
  disabled:
    claude-sonnet-5:
      scope: global
      applies_to: [selection, fallback]
      reason: dominated_cost_quality_frontier
      evidence: references/model-evidence.md#cursorbench-32-coding-agent-evidence

effort:
  allowed: [fixed, low, medium, high]
  denied: [max, xhigh, extra-high, ultra]
  exceptions: [luna-max, kimi-k3-max]

selection:
  start: lowest_sufficient_tier
  within_tier: first_available
  next_profile_when: unavailable
  on_capability_failure: next_tier
  on_tier_unavailable: next_tier
  unavailable_when:
    - absent_from_harness
    - policy_denied
    - quota_exhausted
    - launch_rejected

profiles:
  composer-fast:
    model: composer-2.5
    effort: fixed
    mode: fast

  luna-high:
    model: gpt-5.6-luna
    effort: high

  kimi-k2.7:
    model: kimi-k2.7-code
    effort: fixed

  terra-high:
    model: gpt-5.6-terra
    effort: high

  sol-medium:
    model: gpt-5.6-sol
    effort: medium

  luna-max:
    model: gpt-5.6-luna
    effort: max

  opus-medium:
    model: claude-opus-4.8
    effort: medium

  grok-high:
    model: grok-4.5
    effort: high

  sol-high:
    model: gpt-5.6-sol
    effort: high

  kimi-k3-max:
    model: kimi-k3
    effort: max

  opus-high:
    model: claude-opus-4.8
    effort: high

  fable-high:
    model: claude-fable-5
    effort: high

tiers:
  T1: [composer-fast, luna-high, kimi-k2.7]
  T2: [terra-high]
  T3: [sol-medium, luna-max, opus-medium, grok-high]
  T4: [sol-high, kimi-k3-max, opus-high, fable-high]
