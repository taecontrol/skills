    T1: [cursor-composer-standard, cursor-composer-fast]
    T3: [cursor-grok-fast]
  codex:
    T1: [codex-luna-high]
    T2: [codex-sol-low]
    T3: [codex-sol-medium]
    T4: [codex-sol-high]
  kimi-code:
    T1: [moonshot-kimi-k2.7]
    T4: [moonshot-kimi-k3]
  claude-code:
    T4: [claude-code-fable-high, claude-code-opus-high]
  hermes:
    T1: [hermes-luna-high, hermes-kimi-k2.7]
    T2: [hermes-sol-low]
    T3: [hermes-sol-medium]
    T4: [hermes-sol-high, hermes-kimi-k3]

fallbacks:
  - from: cursor-composer-standard
    to: cursor-composer-fast
    cause: latency
    approval: false
  - from: codex-luna-high
