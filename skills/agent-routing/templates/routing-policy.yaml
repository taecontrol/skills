version: 1

# Portable example policy. Verify runtime identifiers, subscriptions, and model
# availability before use. Unlisted routes are denied by default.
defaults:
  deny_unlisted_routes: true
  no_silent_provider_substitution: true
  cross_runtime: explicit_only
  announce_before_delegation: true
  approval:
    metered_cost_usd_threshold: 1.00
    require_for_denied_effort_without_exception: true
    require_for_provider_switch: true
    require_for_destructive_or_public_action: true
  telemetry:
    unknown_value: unknown
    prefer_runtime_actuals: true
    retain_benchmark_metric_versions: true

effort_policy:
  # fixed means the surface exposes no selectable effort; it is not max.
  allowed: [fixed, low, medium, high]
  denied: [max, xhigh, extra-high, ultra]
  exceptions:
    - profile: kimi-k3-max
      routes: [moonshot-kimi-k3, hermes-kimi-k3]
      reason: fixed_or_normal_surface_profile

provider_constraints:
  openrouter:
    deny_profile_patterns:
      - "gpt-5.6-*"
      - "kimi-*"
      - "claude-*"
      - "composer-2.5*"
      - "grok-4.5*"

profiles:
  composer-2.5:
    model: composer-2.5
    effort: fixed
    capability_tier: T1
    task_fit: [bounded-implementation, mechanical-refactor, test-backed-change]
    evidence_confidence: medium
    serving_modes:
      standard:
        capability_tier: T1
        quota_impact: low
      fast:
        capability_tier: T1
        quota_impact: high
        select_when: latency_value_exceeds_extra_quota_burn

