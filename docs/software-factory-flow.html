<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Software Factory v0.1 — Flujo adaptativo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; background: #080b12; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg { display: block; width: 100%; height: auto; background: #080b12; }
</style>
</head>
<body>
<svg viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Flujo adaptativo de la Software Factory v0.1</title>
  <desc id="desc">El Coordinator elige entre discovery y delivery según la incertidumbre actual. Discovery llama especialistas y devuelve evidencia. Delivery construye y valida vertical slices. Ambos loops actualizan el mapa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#080b12"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#182033" stroke-width="1" opacity=".42"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#818cf8"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#grid)"/>
  <text x="52" y="42" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="3">SOFTWARE FACTORY</text>
  <text x="1348" y="42" fill="#6366f1" font-size="16" font-weight="800" text-anchor="end">V0.1 · ADAPTIVE</text>

  <!-- Coordinator -->
  <g filter="url(#shadow)"><rect x="50" y="65" width="1300" height="155" rx="18" fill="#111827" stroke="#6366f1" stroke-width="2"/></g>
  <circle cx="96" cy="108" r="22" fill="#312e81"/>
  <text x="96" y="116" text-anchor="middle" fill="#e0e7ff" font-size="22" font-weight="850">C</text>
  <text x="135" y="116" fill="#f8fafc" font-size="29" font-weight="800">Coordinator</text>
  <text x="135" y="150" fill="#94a3b8" font-size="18">No predice el camino completo. Identifica la incertidumbre actual y el próximo movimiento útil.</text>
  <g font-size="15" font-weight="700" fill="#cbd5e1">
    <rect x="135" y="174" width="325" height="30" rx="15" fill="#0b1220" stroke="#28344b"/><text x="297" y="194" text-anchor="middle">Inspecciona evidencia</text>
    <rect x="538" y="174" width="325" height="30" rx="15" fill="#0b1220" stroke="#28344b"/><text x="700" y="194" text-anchor="middle">Elige skill o agente</text>
    <rect x="940" y="174" width="325" height="30" rx="15" fill="#0b1220" stroke="#28344b"/><text x="1102" y="194" text-anchor="middle">Actualiza decisiones y mapa</text>
  </g>

  <!-- Router -->
  <line x1="700" y1="220" x2="700" y2="264" stroke="#818cf8" stroke-width="3"/>
  <rect x="478" y="242" width="444" height="42" rx="21" fill="#171e2f" stroke="#28344b"/>
  <text x="700" y="268" text-anchor="middle" fill="#c7d2fe" font-size="15" font-weight="850" letter-spacing="1">ELIGE SEGÚN LA FRONTERA DE INCERTIDUMBRE</text>
  <path d="M700 284V300H330V322" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow-indigo)"/>
  <path d="M700 284V300H1035V322" fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow-indigo)"/>

  <!-- Discovery container -->
  <g filter="url(#shadow)"><rect x="50" y="325" width="560" height="470" rx="18" fill="#0c1624" stroke="#38bdf8" stroke-width="2"/></g>
  <text x="82" y="367" fill="#38bdf8" font-size="14" font-weight="850" letter-spacing="2">DISCOVERY LOOP</text>
  <text x="82" y="397" fill="#f8fafc" font-size="25" font-weight="800">Cuando no conocemos el camino</text>

  <rect x="88" y="430" width="484" height="70" rx="14" fill="#111827" stroke="#334155"/>
  <circle cx="122" cy="465" r="16" fill="#0c4a6e"/><text x="122" y="471" text-anchor="middle" fill="#e0f2fe" font-size="16" font-weight="850">1</text>
  <text x="152" y="459" fill="#f8fafc" font-size="19" font-weight="780">Pregunta abierta</text>
  <text x="152" y="484" fill="#94a3b8" font-size="14">¿Qué evidencia reduciría esta incertidumbre?</text>
  <line x1="330" y1="500" x2="330" y2="526" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="88" y="535" width="484" height="130" rx="14" fill="#111827" stroke="#334155"/>
  <circle cx="122" cy="570" r="16" fill="#0c4a6e"/><text x="122" y="576" text-anchor="middle" fill="#e0f2fe" font-size="16" font-weight="850">2</text>
  <text x="152" y="576" fill="#f8fafc" font-size="19" font-weight="780">Despacho especializado</text>
  <g font-size="13" font-weight="750" fill="#bae6fd">
    <rect x="112" y="603" width="86" height="29" rx="14" fill="#082f49"/><text x="155" y="622" text-anchor="middle">Research</text>
    <rect x="207" y="603" width="70" height="29" rx="14" fill="#082f49"/><text x="242" y="622" text-anchor="middle">Spike</text>
    <rect x="286" y="603" width="94" height="29" rx="14" fill="#082f49"/><text x="333" y="622" text-anchor="middle">Prototype</text>
    <rect x="389" y="603" width="91" height="29" rx="14" fill="#082f49"/><text x="434" y="622" text-anchor="middle">Design</text>
    <rect x="489" y="603" width="66" height="29" rx="14" fill="#082f49"/><text x="522" y="622" text-anchor="middle">Debug</text>
  </g>
  <text x="112" y="652" fill="#94a3b8" font-size="13">Skill elegido por la pregunta; no es una fase obligatoria.</text>
  <line x1="330" y1="665" x2="330" y2="691" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="88" y="700" width="484" height="70" rx="14" fill="#0c1f1a" stroke="#34d399"/>
  <circle cx="122" cy="735" r="16" fill="#064e3b"/><text x="122" y="741" text-anchor="middle" fill="#d1fae5" font-size="16" font-weight="850">3</text>
  <text x="152" y="729" fill="#f8fafc" font-size="19" font-weight="780">Evidencia y veredicto</text>
  <text x="152" y="754" fill="#94a3b8" font-size="14">Otra pregunta, una decisión o un slice judgeable.</text>

  <!-- Discovery return -->
  <path d="M88 735H25V142H50" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-indigo)"/>
  <text x="18" y="435" fill="#7dd3fc" font-size="13" font-weight="800" transform="rotate(-90 18 435)">ACTUALIZA LA FRONTERA</text>

  <!-- Delivery container -->
  <g filter="url(#shadow)"><rect x="650" y="325" width="700" height="470" rx="18" fill="#111417" stroke="#34d399" stroke-width="2"/></g>
  <text x="682" y="367" fill="#34d399" font-size="14" font-weight="850" letter-spacing="2">DELIVERY LOOP</text>
  <text x="682" y="397" fill="#f8fafc" font-size="25" font-weight="800">Cuando el próximo vertical slice es judgeable</text>

  <!-- Delivery connectors -->
  <line x1="960" y1="465" x2="1014" y2="465" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M1165 520V542H835V558" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <line x1="960" y1="618" x2="1014" y2="618" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>

  <rect x="690" y="425" width="270" height="95" rx="14" fill="#0d1b2a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="722" cy="458" r="16" fill="#0c4a6e"/><text x="722" y="464" text-anchor="middle" fill="#e0f2fe" font-size="16" font-weight="850">1</text>
  <text x="750" y="464" fill="#f8fafc" font-size="20" font-weight="780">Implementer</text>
  <text x="718" y="496" fill="#94a3b8" font-size="14">Construye el comportamiento.</text>

  <rect x="1015" y="425" width="295" height="95" rx="14" fill="#0c1f1a" stroke="#34d399" stroke-width="2"/>
  <circle cx="1047" cy="458" r="16" fill="#064e3b"/><text x="1047" y="464" text-anchor="middle" fill="#d1fae5" font-size="16" font-weight="850">2</text>
  <text x="1075" y="464" fill="#f8fafc" font-size="20" font-weight="780">Cleaner</text>
  <text x="1043" y="496" fill="#94a3b8" font-size="14">Repara, limpia y ejecuta gates.</text>

  <rect x="690" y="565" width="270" height="105" rx="14" fill="#1b1228" stroke="#c084fc" stroke-width="2"/>
  <circle cx="722" cy="600" r="16" fill="#581c87"/><text x="722" y="606" text-anchor="middle" fill="#f3e8ff" font-size="16" font-weight="850">3</text>
  <text x="750" y="606" fill="#f8fafc" font-size="20" font-weight="780">Verifier</text>
  <text x="718" y="638" fill="#94a3b8" font-size="14">Juzga código y arquitectura.</text>

  <rect x="1015" y="565" width="295" height="105" rx="14" fill="#241b08" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="1047" cy="600" r="16" fill="#78350f"/><text x="1047" y="606" text-anchor="middle" fill="#fef3c7" font-size="16" font-weight="850">4</text>
  <text x="1075" y="606" fill="#f8fafc" font-size="19" font-weight="780">Product Validator</text>
  <text x="1043" y="638" fill="#94a3b8" font-size="14">Prueba recorridos reales.</text>

  <!-- Repair loop -->
  <path d="M1310 617H1330V475H1310" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="1323" y="548" fill="#fb7185" font-size="12" font-weight="850" transform="rotate(-90 1323 548)">REPAIR / FAIL</text>

  <!-- Commit -->
  <path d="M1162 670V690H1000V708" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="840" y="715" width="320" height="55" rx="14" fill="#0c1f1a" stroke="#34d399" stroke-width="2"/>
  <circle cx="873" cy="742" r="15" fill="#064e3b"/><text x="873" y="748" text-anchor="middle" fill="#d1fae5" font-size="15" font-weight="850">5</text>
  <text x="903" y="748" fill="#f8fafc" font-size="19" font-weight="780">Commit + adaptar el mapa</text>

  <!-- Delivery return -->
  <path d="M1160 742H1375V142H1350" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-green)"/>
  <text x="1382" y="438" fill="#6ee7b7" font-size="13" font-weight="800" transform="rotate(90 1382 438)">EVIDENCIA CAMBIA LA RUTA</text>

  <!-- Rules -->
  <rect x="50" y="825" width="1300" height="50" rx="13" fill="#111827" stroke="#28344b"/>
  <circle cx="78" cy="850" r="6" fill="#818cf8"/>
  <text x="98" y="846" fill="#cbd5e1" font-size="14"><tspan font-weight="850" fill="#f8fafc">Discovery code:</tspan><tspan> desechable por defecto; promoverlo exige decisión explícita y el delivery loop completo.</tspan></text>
  <text x="98" y="866" fill="#94a3b8" font-size="13">El humano interviene cuando la evidencia prepara o cuestiona una decisión material, no para aprobar cada movimiento.</text>
</svg>
</body>
</html>
